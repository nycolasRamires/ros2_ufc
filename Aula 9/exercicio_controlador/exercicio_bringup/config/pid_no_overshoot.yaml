# Arquivo de parâmetros de configuração de controlador de esforço para o carrinho deslizante. Ganhos foram tunados para evitar sobrepasso de velocidade.

controller_manager:
  ros__parameters:
    update_rate: 1000 # Hz

    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

joint_trajectory_controller:
  ros__parameters:
    type: joint_trajectory_controller/JointTrajectoryController
    joints:
      - slider_to_cart
    command_interfaces:
      - effort
    state_interfaces:
      - position
      - velocity
    gains:
      slider_to_cart:
        p: 0.0
        i: 0.0
        d: 50.0
        i_clamp: 0.0
        antiwindup: false
